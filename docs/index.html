<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>etch-a-sketch!</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/splash.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dokdo&family=Gamja+Flower&display=swap" rel="stylesheet">
</head>
<body>

     <div class="splashContainer">
        <h1 class="splashHeader">etch-a-sketch</h1>
        <div class="intro">
            <p class="splashP1">This is a two-player collaboration game. Work together to create a masterpiece!</p>
            <p class="splashP1">Invite a friend to start drawing on the etch-a-sketch. P1 draws left and right, P2 draws up and down. Click the button to shake and erase the drawing.</p>
        </div>
        <div class="socketSplash">
            <p id="splashP" class="splashP"></p>
            <p id="whichPlayer" class="whichPlayer"></p>
            <p id="directions" class="directions"></p>
        </div>
     </div>

     <div class="container">
        <img src="./assets/etchasketch.png" class="etchImg">
        <div class="canvasContainer">
            <canvas class="EASCanvas" id="canvas"></canvas>
        </div>
        <div class="buttonContainer">
            <input type="button" id="btn" value="shake to erase!" class="btn">
        </div>
        
     </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="./js/script.js"></script>
    <script src="./js/splash.js"></script>
</body>
</html>
