<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>etch-a-sketch!</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/splash.css">
</head>
<body>
    <!-- <canvas id="board" width="600" height="400" style="border:8px dotted #92b4f7">draw</canvas> -->
     <div class="splashContainer">
        <h1 class="splashHeader">Etch-a-Sketch</h1>
        <p class="splashP1">This is a two-player game! Invite a friend to start drawing on the etch-a-sketch. P1 draws left and right, P2 draws up an down. Shake both of your mouses at the same time to clear the sketch.</p>
        <p class="splashP">waiting for players...</p>

     </div>
     <div class="container">
        <img src="./assets/etchasketch.png" class="etchImg">
        <div class="canvasContainer">
            <canvas class="EASCanvas" id="canvas"></canvas>
        </div>
     </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="./js/script.js"></script>
    <script src="./js/splash.js"></script>
</body>
</html>
